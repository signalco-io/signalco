# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "[Companions] Signalco.Companion.Maui Build for Android"

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ./companions/maui

jobs:
  build:
    name: Build ${{ matrix.configuration }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        configuration: ['Debug', 'Release']
    steps:
    - uses: actions/checkout@v5
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Install workload
      run: dotnet workload install maui-android
    - name: Setup Java JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Install Android SDK dependencies
      run: dotnet build ./Signalco.Companion.Maui/Signalco.Companion.Maui.csproj -t:InstallAndroidDependencies -f net10.0-android -p:TargetFrameworks=net10.0-android -p:AcceptAndroidSdkLicenses=True
    - name: Build
      run: dotnet build ./Signalco.Companion.Maui/Signalco.Companion.Maui.csproj -c ${{ matrix.configuration }} -f net10.0-android -p:TargetFrameworks=net10.0-android
    - name: Publish
      run: dotnet publish ./Signalco.Companion.Maui/Signalco.Companion.Maui.csproj -c ${{ matrix.configuration }} -f net10.0-android -p:TargetFrameworks=net10.0-android -o ./artifacts
    - name: Pack files
      shell: bash
      run: |
        # Pack files
        7z a -tzip "companion-maui-android-${{ matrix.configuration }}.zip" "./artifacts/*"
        
        # Delete output directory
        rm -r "artifacts"
    - name: Upload artifacts
      uses: actions/upload-artifact@v5
      with:
        name: "artifact-${{ matrix.configuration }}"
        path: "companions/maui/companion-maui-android-${{ matrix.configuration }}.zip"
        if-no-files-found: error
