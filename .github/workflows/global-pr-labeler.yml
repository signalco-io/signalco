# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: "[Global] PR Labeler"

on:
  pull_request_target:
    types: [opened, reopened, synchronize, edited]

jobs:
  labeler:
    name: "Label pull request"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Read configuration from the default branch through the API. Never check out
      # PR code in this privileged workflow, so fork PRs can be labeled safely.
      - uses: actions/labeler@b8dd2d9be0f68b860e7dae5dae7d772984eacd6d # v6.2.0
        with:
          sync-labels: true
